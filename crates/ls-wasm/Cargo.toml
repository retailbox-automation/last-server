[package]
name = "ls-wasm"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "Browser build of the Last Server rules: the same ls-core crate the contract runs, behind wasm-bindgen"

[lib]
crate-type = ["cdylib"]

[dependencies]
ls-core = { path = "../ls-core", features = ["serde"] }
wasm-bindgen = "=0.2.130"
serde_json = "1"
