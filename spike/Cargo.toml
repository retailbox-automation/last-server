[package]
name = "spike"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "Sandbox gas benchmark and NEP-245 checks for the Last Server contract"

[dependencies]

[dev-dependencies]
ls-core = { path = "../crates/ls-core", features = ["serde", "bot"] }
near-workspaces = "=0.24.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
